server:
  port: 48443
  read_timeout: 30s
  write_timeout: 60s
  shutdown_timeout: 15s

storage:
  data_dir: ./data
  db_path: ./data/regdispatch.db

dispatch:
  ack_timeout: 60s
  max_retries: 5
  retry_base_delay: 2s
  retry_max_delay: 30s

compaction:
  interval: 5m
  retain_events: 10000

upstream:
  mock_url: http://127.0.0.1:48444
  timeout: 10s
  breaker_threshold: 5
  breaker_timeout: 30s
  breaker_half_open_max: 3

logging:
  level: info
  format: console
